type User @model @auth(rules: [{allow: owner, ownerField: "owner"}])
{
  email: String!
  firstName: String
  lastName: String
  organization: String
  role: String
  bio: String
}

type Paper @model @auth(rules: [{allow: owner, ownerField: "owner"}])
{
  title: String!
  authors: String
  abstract: String
  status: String
}