type User @model @auth(rules: [{allow: private}])
{
  id: ID! @primaryKey
  email: String!
  fullName: String!
  institution: String!
  role: String!
  bio: String
}

type Paper @model @auth(rules: [{allow: private}])
{
  id: ID! @primaryKey
  title: String!
  authors: String
  abstract: String
  status: String
}